server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React / Vite SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
        access_log off;
    }
}
