# CLOUD BUILD CONFIG WITH ENHANCED LOGGING

# (Optional) If you want to store logs in a bucket, uncomment:
# logsBucket: "gs://$PROJECT_ID-cloudbuild-logs"

options:
  logging: CLOUD_LOGGING_ONLY    # Avoids build.service_account error
  logStreamingOption: STREAM_ON  # Ensures logs appear in real time
  machineType: "E2_HIGHCPU_8"    # Faster build (optional)

steps:
  # 1. Install dependencies
  - name: "node:18"
    id: "Install Dependencies"
    entrypoint: npm
    args: ["install"]

  # 2. Build Vite project
  - name: "node:18"
    id: "Build Vite"
    entrypoint: npm
    args: ["run", "build"]

  # 3. Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Docker Image"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest",
        ".",
      ]

  # 4. Push Docker image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "Push Docker Image"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest",
      ]

  # 5. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy to Cloud Run"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "dpi-web",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest",
        "--platform",
        "managed",
        "--region",
        "us-central1",
        "--allow-unauthenticated",
        "--update-env-vars",
        "LOG_LEVEL=debug",
      ]

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest"
