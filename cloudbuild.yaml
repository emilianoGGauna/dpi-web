steps:
  # 1. Install dependencies
  - name: "node:18"
    entrypoint: npm
    args: ["install"]

  # 2. Build Vite project
  - name: "node:18"
    entrypoint: npm
    args: ["run", "build"]

  # 3. Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest",
        ".",
      ]

  # 4. Push Docker image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest",
      ]

  # 5. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "dpi-web",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest",
        "--platform",
        "managed",
        "--region",
        "us-central1",
        "--allow-unauthenticated",
      ]

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/dpi-web/dpi-web:latest"
